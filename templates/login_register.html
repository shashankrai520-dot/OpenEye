<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenEye - Login/Register</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    :root {
      --bg-light: #f4f7f9;
      --primary-blue: #007bff;
      --accent-teal: #17a2b8;
      --text-dark: #343a40;
      --card-bg: rgba(255, 255, 255, 0.9);
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://source.unsplash.com/random/1920x1080/?city,sky,login');
      background-size: cover;
      background-attachment: fixed;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
    }

    h1 {
      color: var(--primary-blue);
      text-align: center;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-radius: 5px;
      overflow: hidden;
    }

    .tabs button {
      flex-grow: 1;
      padding: 10px;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
      background-color: #e9ecef;
      color: #6c757d;
      transition: background-color 0.3s;
    }

    .tabs button.active {
      background-color: var(--primary-blue);
      color: white;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-teal);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
      margin-top: 15px;
    }

    .btn-submit:hover {
      background-color: #138496;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: 500;
    }

    .auth-options {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
    }

    .auth-options button {
      padding: 15px 25px;
      background-color: var(--accent-teal);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
    }

    .auth-options button:hover {
      background-color: var(--primary-blue);
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--primary-blue);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <a href="{{ url_for('index') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

  <div class="container">
    <h1>Welcome to OpenEye Access</h1>

    <div id="user-type-selection">
      <p style="text-align: center; font-size: 1.1em;">Please select your user type to proceed:</p>
      <div class="auth-options">
        <button onclick="selectUserType('government')"><i class="fas fa-user-shield"></i> Government</button>
        <button onclick="selectUserType('public')"><i class="fas fa-users"></i> Public</button>
      </div>
    </div>

    <div id="auth-forms" style="display: none;">
      <div class="tabs">
        <button id="tab-login" class="active" onclick="showTab('login')">Login</button>
        <button id="tab-register" onclick="showTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label id="login-username-label" for="login-username"></label>
          <input type="text" id="login-username" name="login-username" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="login-password" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
        <!-- Public Fields -->
        <div id="public-fields">
          <div class="form-group">
            <label for="reg-username-public">Username (Suggested)</label>
            <input type="text" id="reg-username-public" name="username" readonly required>
          </div>
          <div class="form-group">
            <label for="reg-password-public">Password</label>
            <input type="password" id="reg-password-public" name="password_public" required>
          </div>
        </div>

        <!-- Government Fields -->
        <div id="government-fields" style="display: none;">
          <div class="form-group">
            <label for="reg-email-gov">Email ID</label>
            <input type="email" id="reg-email-gov" name="email">
          </div>
          <div class="form-group">
            <label for="reg-name-gov">Name</label>
            <input type="text" id="reg-name-gov" name="username">
          </div>
          <div class="form-group">
            <label for="reg-password-gov">Password</label>
            <input type="password" id="reg-password-gov" name="password">
          </div>
          <div class="form-group">
            <label for="reg-office-gov">Municipal Office</label>
            <input type="text" id="reg-office-gov" name="office">
          </div>
          <div class="form-group">
            <label for="reg-post-gov">Post Description</label>
            <input type="text" id="reg-post-gov" name="description">
          </div>
        </div>

        <button type="submit" class="btn-submit">Register</button>
      </form>

      <p id="auth-message" class="message"></p>
    </div>
  </div>

  <script>
  let currentUserType = '';

  function showTab(tab) {
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('auth-message').textContent = '';

    if (tab === 'login') {
      document.getElementById('tab-login').classList.add('active');
      document.getElementById('login-form').style.display = 'block';
    } else {
      document.getElementById('tab-register').classList.add('active');
      document.getElementById('register-form').style.display = 'block';
    }
  }

  function generatePublicUsername() {
    const adjectives = ['Anonymous', 'Observer', 'Citizen', 'Silent'];
    const nouns = ['Eye', 'Voice', 'Watch', 'Truth'];
    return `${adjectives[Math.floor(Math.random() * adjectives.length)]}${nouns[Math.floor(Math.random() * nouns.length)]}${Math.floor(Math.random() * 900) + 100}`;
  }

  function selectUserType(type) {
    currentUserType = type;
    document.getElementById('user-type-selection').style.display = 'none';
    document.getElementById('auth-forms').style.display = 'block';

    const loginLabel = document.getElementById('login-username-label');
    const regUsernameInput = document.getElementById('reg-username-public');

    const publicFields = document.querySelectorAll('#public-fields input');
    const governmentFields = document.querySelectorAll('#government-fields input');

    if (type === 'government') {
      loginLabel.textContent = 'Email ID';
      document.getElementById('public-fields').style.display = 'none';
      document.getElementById('government-fields').style.display = 'block';
      publicFields.forEach(input => input.disabled = true);
      governmentFields.forEach(input => input.disabled = false);
    } else {
      loginLabel.textContent = 'Username';
      regUsernameInput.value = generatePublicUsername();
      document.getElementById('public-fields').style.display = 'block';
      document.getElementById('government-fields').style.display = 'none';
      publicFields.forEach(input => input.disabled = false);
      governmentFields.forEach(input => input.disabled = true);
    }

    showTab('login');
  }

  // Register handler
  async function handleRegister(event) {
    event.preventDefault();

    let payload = {};
    if (currentUserType === 'government') {
      payload = {
        user_type: 'government',
        email: document.getElementById('reg-email-gov').value,
        username: document.getElementById('reg-name-gov').value,
        password: document.getElementById('reg-password-gov').value,
        office: document.getElementById('reg-office-gov').value,
        description: document.getElementById('reg-post-gov').value
      };
    } else {
      payload = {
        user_type: 'public',
        username: document.getElementById('reg-username-public').value,
        password: document.getElementById('reg-password-public').value
      };
    }

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      document.getElementById('auth-message').textContent = data.message;
    } catch (err) {
      document.getElementById('auth-message').textContent = 'Error: Could not connect to server.';
    }
  }

  // Login handler
  async function handleLogin(event) {
    event.preventDefault();

    const payload = {
      user_type: currentUserType,
      identifier: document.getElementById('login-username').value,
      password: document.getElementById('login-password').value
    };

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      document.getElementById('auth-message').textContent = data.message;
    } catch (err) {
      document.getElementById('auth-message').textContent = 'Error: Could not connect to server.';
    }
  }
</script>
</body>
</html>
